<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>가사 디스플레이</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg2: #141414;
      --bg3: #1e1e1e;
      --fg: #e8e8e8;
      --fg-dim: #6a6a6a;
      --fg-mid: #9a9a9a;
      --accent: #1db954;
      --accent-bright: #1ed760;
      --danger: #e74c3c;
      --touch: 64px;
      --font-base: 28px;
      --font-current: 40px;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #app { display: flex; flex-direction: column; height: 100%; }

    /* Header / Search */
    .topbar {
      flex-shrink: 0;
      padding: 16px 20px;
      background: var(--bg2);
      border-bottom: 1px solid #222;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 10;
    }
    .search-wrap { flex: 1; display: flex; gap: 10px; }
    #searchInput {
      flex: 1;
      height: var(--touch);
      font-size: 22px;
      padding: 0 20px;
      border-radius: var(--radius);
      border: 2px solid #333;
      background: var(--bg3);
      color: var(--fg);
      outline: none;
    }
    #searchInput:focus { border-color: var(--accent); }
    .btn {
      height: var(--touch);
      min-width: var(--touch);
      padding: 0 22px;
      font-size: 20px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      background: var(--bg3);
      color: var(--fg);
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
    }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover, .btn-primary.active { background: var(--accent-bright); }
    .btn-ghost { background: transparent; border: 2px solid #333; }
    .btn-sm { height: 52px; min-width: 52px; font-size: 18px; padding: 0 16px; }
    .btn.playing { background: var(--danger); color: #fff; }

    /* Panels */
    .main { flex: 1; display: flex; overflow: hidden; position: relative; }
    .hidden { display: none !important; }
    .panel {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px;
      z-index: 1;
    }
    #searchPanel { z-index: 2; }
    #playerPanel { z-index: 3; padding: 0; }
    .panel.hidden { display: none !important; pointer-events: none !important; }

    /* Results */
    .result-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 18px 20px;
      margin-bottom: 10px;
      background: var(--bg2);
      border-radius: var(--radius);
      border: 2px solid transparent;
      cursor: pointer;
      min-height: 80px;
    }
    .result-item:active, .result-item:hover { border-color: var(--accent); background: var(--bg3); }
    .result-title { font-size: 24px; font-weight: 700; }
    .result-meta { font-size: 18px; color: var(--fg-mid); }
    .badge {
      display: inline-block;
      font-size: 14px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .badge-sync { background: var(--accent); color: #000; }
    .badge-plain { background: #444; color: #ccc; }
    .section-title {
      font-size: 18px;
      color: var(--fg-dim);
      margin: 8px 0 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .empty, .loading, .error {
      text-align: center;
      padding: 60px 20px;
      font-size: 22px;
      color: var(--fg-dim);
    }
    .error { color: var(--danger); }

    /* Player */
    #playerPanel:not(.hidden) { display: flex; flex-direction: column; }
    .player-header {
      flex-shrink: 0;
      padding: 14px 20px;
      background: linear-gradient(180deg, var(--bg2) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      z-index: 5;
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title { font-size: 26px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 18px; color: var(--fg-mid); margin-top: 4px; }

    .lyrics-viewport {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      position: relative;
      mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
    }
    .lyrics-spacer { height: 40vh; }
    .lyric-line {
      text-align: center;
      padding: 14px 32px;
      font-size: var(--font-base);
      line-height: 1.45;
      color: var(--fg-dim);
      cursor: pointer;
      transition: color 0.25s, font-size 0.25s, opacity 0.25s, transform 0.25s;
      opacity: 0.45;
      user-select: none;
    }
    .lyric-line.near { opacity: 0.7; color: var(--fg-mid); }
    .lyric-line.active {
      color: #fff;
      font-size: var(--font-current);
      font-weight: 700;
      opacity: 1;
      transform: scale(1.02);
      text-shadow: 0 0 24px rgba(29, 185, 84, 0.35);
    }
    .lyric-line:active { background: rgba(255,255,255,0.05); border-radius: 12px; }
    .plain-lyrics {
      white-space: pre-wrap;
      text-align: center;
      font-size: var(--font-base);
      line-height: 1.8;
      color: var(--fg-mid);
      padding: 40px 32px 120px;
    }

    /* Controls */
    .controls {
      flex-shrink: 0;
      padding: 16px 20px 24px;
      background: linear-gradient(0deg, var(--bg) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 5;
    }
    .clock-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-variant-numeric: tabular-nums;
    }
    #clock {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.04em;
      min-width: 140px;
      text-align: center;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .offset-label { font-size: 16px; color: var(--fg-dim); min-width: 90px; text-align: center; }

    /* Fullscreen player hides topbar search */
    body.fs-mode .topbar { display: none; }
    body.fs-mode .player-header { padding-top: 20px; }
    .sp-status { flex-shrink:0; padding:10px 20px; font-size:20px; color:var(--fg-mid); background:#0f0f0f; border-bottom:1px solid #222; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sp-status.on { color: var(--accent-bright); }
    .sp-settings { flex-shrink:0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:14px 20px; background:var(--bg2); font-size:18px; }
    .sp-settings input { flex:1; min-width:320px; height:52px; font-size:20px; padding:0 14px; border-radius:12px; border:2px solid #333; background:var(--bg3); color:var(--fg); }
    .sp-hint { color:var(--fg-dim); font-size:16px; width:100%; }
    body.fs-mode .sp-status { font-size:16px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar" id="topbar">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="곡명 · 아티스트 검색 (예: IU Love wins all)" autocomplete="off" enterkeyhint="search" />
        <button class="btn btn-primary" id="searchBtn" type="button">검색</button>
      </div>
      <button class="btn btn-sm" id="spBtn" type="button" style="background:#1db954;color:#000">🎵 Spotify 연결</button>
      <button class="btn btn-ghost btn-sm" id="spSettingsBtn" type="button" title="설정">⚙</button>
      <button class="btn btn-ghost btn-sm" id="backBtn" type="button" style="display:none">← 목록</button>
    </div>

    <div id="spStatus" class="sp-status">Spotify 미연결 · 수동 모드</div>
    <div id="spSettings" class="sp-settings hidden">
      <label for="spClientId">Spotify Client ID</label>
      <input id="spClientId" type="text" autocomplete="off" placeholder="Spotify 개발자 대시보드의 Client ID" />
      <button class="btn btn-primary btn-sm" id="spSaveId" type="button">저장</button>
      <span class="sp-hint">Redirect URI: <code id="spRedirect"></code></span>
    </div>
    <div class="main">
      <div class="panel" id="searchPanel">
        <div id="recentSection" style="display:none">
          <div class="section-title">최근 곡</div>
          <div id="recentList"></div>
        </div>
        <div id="resultsSection">
          <div class="empty" id="emptyState">곡을 검색한 뒤, 노래가 시작할 때 ▶ 시작 을 누르세요.</div>
          <div class="loading hidden" id="loadingState">검색 중…</div>
          <div class="error hidden" id="errorState"></div>
          <div id="resultsList"></div>
        </div>
      </div>

      <div class="panel hidden" id="playerPanel" style="padding:0">
        <div class="player-header">
          <div class="song-info">
            <div class="song-title" id="songTitle">—</div>
            <div class="song-artist" id="songArtist">—</div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0">
            <button class="btn btn-ghost btn-sm" id="fontMinus" type="button" title="글자 작게">A−</button>
            <button class="btn btn-ghost btn-sm" id="fontPlus" type="button" title="글자 크게">A+</button>
            <button class="btn btn-ghost btn-sm" id="fsBtn" type="button">⛶ 전체화면</button>
          </div>
        </div>
        <div class="lyrics-viewport" id="lyricsViewport">
          <div class="lyrics-spacer"></div>
          <div id="lyricsBody"></div>
          <div class="lyrics-spacer"></div>
        </div>
        <div class="controls">
          <div class="clock-row">
            <button class="btn btn-sm" id="seekBack" type="button">−5초</button>
            <div id="clock">0:00.0</div>
            <button class="btn btn-sm" id="seekFwd" type="button">+5초</button>
          </div>
          <div class="control-row">
            <button class="btn btn-sm" id="offsetMinus" type="button">−0.5초</button>
            <span class="offset-label" id="offsetLabel">오프셋 0.0초</span>
            <button class="btn btn-sm" id="offsetPlus" type="button">+0.5초</button>
          </div>
          <div class="control-row">
            <button class="btn btn-primary" id="playBtn" type="button" style="min-width:200px;height:72px;font-size:24px">▶ 시작</button>
            <button class="btn btn-ghost" id="resetBtn" type="button">↻ 리셋</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
// Spotify 앱 Client ID (비워두면 설정 입력값 사용)
const SPOTIFY_CLIENT_ID = '';
(function () {
  'use strict';

  const API = 'https://lrclib.net/api';
  const LS_RECENT = 'lyrics_recent_v1';
  const LS_OFFSET = 'lyrics_offset_v1';
  const LS_FONT = 'lyrics_font_v1';
  const MAX_RECENT = 12;

  /** @typedef {{ time: number, text: string }} LyricLine */
  /** @typedef {{ id: number, title: string, artist: string, album: string, duration: number, synced: boolean, plainLyrics?: string, syncedLyrics?: string }} Song */

  const $ = (id) => document.getElementById(id);
  const els = {
    searchInput: $('searchInput'),
    searchBtn: $('searchBtn'),
    backBtn: $('backBtn'),
    searchPanel: $('searchPanel'),
    playerPanel: $('playerPanel'),
    recentSection: $('recentSection'),
    recentList: $('recentList'),
    resultsList: $('resultsList'),
    emptyState: $('emptyState'),
    loadingState: $('loadingState'),
    errorState: $('errorState'),
    songTitle: $('songTitle'),
    songArtist: $('songArtist'),
    lyricsViewport: $('lyricsViewport'),
    lyricsBody: $('lyricsBody'),
    clock: $('clock'),
    playBtn: $('playBtn'),
    resetBtn: $('resetBtn'),
    offsetMinus: $('offsetMinus'),
    offsetPlus: $('offsetPlus'),
    offsetLabel: $('offsetLabel'),
    seekBack: $('seekBack'),
    seekFwd: $('seekFwd'),
    fontMinus: $('fontMinus'),
    fontPlus: $('fontPlus'),
    fsBtn: $('fsBtn'),
  };

  let currentSong = null;
  /** @type {LyricLine[]} */
  let lines = [];
  let isSynced = false;
  let playing = false;
  let baseTime = 0;       // song position (sec) at last play/pause
  let baseWall = 0;       // performance.now() at last play
  let offset = 0;         // user offset seconds
  let activeIdx = -1;
  let rafId = 0;
  let fontScale = 1;

  // ---------- LRC parser ----------
  function parseTimeTag(tag) {
    // mm:ss.xx or mm:ss.xxx or mm:ss
    const m = tag.match(/^(\d{1,3}):(\d{1,2})(?:\.(\d{1,3}))?$/);
    if (!m) return null;
    const min = parseInt(m[1], 10);
    const sec = parseInt(m[2], 10);
    let frac = 0;
    if (m[3] != null) {
      const f = m[3];
      frac = parseInt(f, 10) / Math.pow(10, f.length);
    }
    return min * 60 + sec + frac;
  }

  /**
   * Parse LRC text into sorted lyric lines.
   * Supports multiple timestamps per line and [offset:±ms] tag.
   * @param {string} lrc
   * @returns {{ lines: LyricLine[], offsetMs: number }}
   */
  function parseLRC(lrc) {
    if (!lrc) return { lines: [], offsetMs: 0 };
    let offsetMs = 0;
    /** @type {LyricLine[]} */
    const out = [];
    const raw = lrc.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    const lineRe = /\[([^\]]+)\]/g;

    for (const rawLine of raw) {
      const line = rawLine.trim();
      if (!line) continue;

      // metadata / offset
      const meta = line.match(/^\[(ti|ar|al|by|offset|re|ve|length):([^\]]*)\]$/i);
      if (meta) {
        if (meta[1].toLowerCase() === 'offset') {
          offsetMs = parseInt(meta[2].trim(), 10) || 0;
        }
        continue;
      }

      const tags = [];
      let lastIdx = 0;
      let m;
      lineRe.lastIndex = 0;
      while ((m = lineRe.exec(line)) !== null) {
        const t = parseTimeTag(m[1]);
        if (t != null) {
          tags.push(t);
          lastIdx = m.index + m[0].length;
        } else {
          // non-time tag mid-line — stop treating as lyric tags
          break;
        }
      }
      if (!tags.length) continue;
      const text = line.slice(lastIdx).trim();
      for (const t of tags) {
        out.push({ time: t, text });
      }
    }

    out.sort((a, b) => a.time - b.time || a.text.localeCompare(b.text));
    return { lines: out, offsetMs };
  }

  // Expose for node test
  window.__parseLRC = parseLRC;

  // ---------- Time helpers ----------
  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = sec - m * 60;
    return m + ':' + s.toFixed(1).padStart(4, '0');
  }

  function nowPos() {
    if (!playing) return baseTime;
    return baseTime + (performance.now() - baseWall) / 1000;
  }

  function effectivePos() {
    return nowPos() + offset;
  }

  // ---------- Storage ----------
  function loadRecent() {
    try { return JSON.parse(localStorage.getItem(LS_RECENT) || '[]'); }
    catch { return []; }
  }
  function saveRecent(song) {
    const list = loadRecent().filter((s) => s.id !== song.id);
    list.unshift({
      id: song.id,
      title: song.title,
      artist: song.artist,
      album: song.album,
      duration: song.duration,
      synced: song.synced,
    });
    localStorage.setItem(LS_RECENT, JSON.stringify(list.slice(0, MAX_RECENT)));
  }
  function loadOffsets() {
    try { return JSON.parse(localStorage.getItem(LS_OFFSET) || '{}'); }
    catch { return {}; }
  }
  function saveOffset(songId, val) {
    const o = loadOffsets();
    o[String(songId)] = val;
    localStorage.setItem(LS_OFFSET, JSON.stringify(o));
  }
  function getOffset(songId) {
    const o = loadOffsets();
    const v = o[String(songId)];
    return typeof v === 'number' ? v : 0;
  }

  // ---------- Font ----------
  function applyFont() {
    const base = Math.round(28 * fontScale);
    const cur = Math.round(40 * fontScale);
    document.documentElement.style.setProperty('--font-base', base + 'px');
    document.documentElement.style.setProperty('--font-current', cur + 'px');
    localStorage.setItem(LS_FONT, String(fontScale));
  }
  try {
    const f = parseFloat(localStorage.getItem(LS_FONT) || '1');
    if (isFinite(f) && f >= 0.7 && f <= 2) fontScale = f;
  } catch {}
  applyFont();

  // ---------- UI: search ----------
  function showSearch() {
    els.searchPanel.classList.remove('hidden');
    els.playerPanel.classList.add('hidden');
    els.backBtn.style.display = 'none';
    stopPlayback(false);
    renderRecent();
  }

  function setLoading(on) {
    els.loadingState.classList.toggle('hidden', !on);
    els.emptyState.classList.add('hidden');
    if (on) {
      els.errorState.classList.add('hidden');
      els.resultsList.innerHTML = '';
    }
  }

  function showError(msg) {
    els.errorState.textContent = msg;
    els.errorState.classList.remove('hidden');
    els.loadingState.classList.add('hidden');
    els.emptyState.classList.add('hidden');
  }

  function renderSongCard(song, container) {
    const el = document.createElement('div');
    el.className = 'result-item';
    const dur = song.duration ? formatDuration(song.duration) : '';
    const badge = song.synced
      ? '<span class="badge badge-sync">싱크</span>'
      : '<span class="badge badge-plain">일반</span>';
    el.innerHTML =
      '<div class="result-title">' + escapeHtml(song.title) + badge + '</div>' +
      '<div class="result-meta">' + escapeHtml(song.artist) +
      (song.album ? ' · ' + escapeHtml(song.album) : '') +
      (dur ? ' · ' + dur : '') + '</div>';
    el.addEventListener('click', () => openSong(song));
    container.appendChild(el);
  }

  function formatDuration(sec) {
    const s = Math.round(Number(sec) || 0);
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + String(r).padStart(2, '0');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function normalizeResult(r) {
    return {
      id: r.id,
      title: r.trackName || r.name || '제목 없음',
      artist: r.artistName || '아티스트 미상',
      album: r.albumName || '',
      duration: r.duration || 0,
      synced: !!(r.syncedLyrics) || r.hasSyncedLyrics === true,
      plainLyrics: r.plainLyrics || null,
      syncedLyrics: r.syncedLyrics || null,
    };
  }

  async function doSearch() {
    const q = els.searchInput.value.trim();
    if (!q) return;
    setLoading(true);
    try {
      const res = await fetch(API + '/search?q=' + encodeURIComponent(q));
      if (!res.ok) throw new Error('검색 실패 (' + res.status + ')');
      const data = await res.json();
      els.loadingState.classList.add('hidden');
      els.resultsList.innerHTML = '';
      if (!data || !data.length) {
        els.emptyState.textContent = '검색 결과가 없습니다.';
        els.emptyState.classList.remove('hidden');
        return;
      }
      els.emptyState.classList.add('hidden');
      // Prefer items with synced lyrics first
      const mapped = data.map(normalizeResult);
      mapped.sort((a, b) => (b.synced ? 1 : 0) - (a.synced ? 1 : 0));
      const title = document.createElement('div');
      title.className = 'section-title';
      title.textContent = '검색 결과 (' + mapped.length + ')';
      els.resultsList.appendChild(title);
      mapped.forEach((s) => renderSongCard(s, els.resultsList));
    } catch (e) {
      showError('검색 오류: ' + (e.message || e));
    }
  }

  function renderRecent() {
    const list = loadRecent();
    els.recentList.innerHTML = '';
    if (!list.length) {
      els.recentSection.style.display = 'none';
      return;
    }
    els.recentSection.style.display = '';
    list.forEach((s) => renderSongCard(s, els.recentList));
  }

  // ---------- Player ----------
  function showSongData(data) {
      const full = normalizeResult(data);
      currentSong = full;
      saveRecent(full);
      offset = getOffset(full.id);
      updateOffsetLabel();

      lines = [];
      isSynced = false;
      if (full.syncedLyrics) {
        const parsed = parseLRC(full.syncedLyrics);
        lines = parsed.lines.map((l) => ({
          time: l.time + parsed.offsetMs / 1000,
          text: l.text,
        }));
        isSynced = lines.length > 0;
      }

      els.songTitle.textContent = full.title;
      els.songArtist.textContent = full.artist + (full.album ? ' · ' + full.album : '');
      renderLyrics();
      baseTime = 0;
      playing = false;
      updatePlayBtn();
      updateClock();
      activeIdx = -1;

      els.searchPanel.classList.add('hidden');
      els.playerPanel.classList.remove('hidden');
      els.backBtn.style.display = '';
      els.loadingState.classList.add('hidden');
      return full;
  }

  async function openSong(songStub) {
    els.errorState.classList.add('hidden');
    setLoading(true);
    showSearch(); // keep panel until loaded
    try {
      // Always fetch full record by id (search payloads vary)
      const res = await fetch(API + '/get/' + encodeURIComponent(songStub.id));
      if (!res.ok) throw new Error('가사 불러오기 실패 (' + res.status + ')');
      const data = await res.json();
      showSongData(data);
      els.loadingState.classList.add('hidden');
    } catch (e) {
      showError('불러오기 오류: ' + (e.message || e));
    }
  }

  function renderLyrics() {
    const body = els.lyricsBody;
    body.innerHTML = '';
    if (isSynced) {
      lines.forEach((line, i) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.dataset.idx = String(i);
        div.textContent = line.text || '♪';
        div.addEventListener('click', () => seekToLine(i));
        body.appendChild(div);
      });
    } else {
      const plain = document.createElement('div');
      plain.className = 'plain-lyrics';
      plain.textContent = (currentSong && currentSong.plainLyrics) || '(가사가 없습니다)';
      body.appendChild(plain);
    }
    els.lyricsViewport.scrollTop = 0;
  }

  function seekToLine(i) {
    if (!isSynced || i < 0 || i >= lines.length) return;
    const t = Math.max(0, lines[i].time - offset);
    baseTime = t;
    baseWall = performance.now();
    highlight(i, true);
    updateClock();
  }

  function findActiveIndex(pos) {
    if (!lines.length) return -1;
    // last line whose time <= pos
    let lo = 0, hi = lines.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (lines[mid].time <= pos) {
        ans = mid;
        lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
    return ans;
  }

  function highlight(idx, forceScroll) {
    const kids = els.lyricsBody.children;
    if (activeIdx === idx && !forceScroll) return;
    if (activeIdx >= 0 && kids[activeIdx]) {
      kids[activeIdx].classList.remove('active', 'near');
    }
    // clear near classes nearby
    for (let i = Math.max(0, activeIdx - 2); i <= Math.min(kids.length - 1, activeIdx + 2); i++) {
      if (kids[i]) kids[i].classList.remove('near');
    }
    activeIdx = idx;
    if (idx < 0) return;
    if (kids[idx]) {
      kids[idx].classList.add('active');
      kids[idx].classList.remove('near');
    }
    if (kids[idx - 1]) kids[idx - 1].classList.add('near');
    if (kids[idx + 1]) kids[idx + 1].classList.add('near');

    // Keep current line centered
    const el = kids[idx];
    if (el) {
      const vp = els.lyricsViewport;
      const target = el.offsetTop - vp.clientHeight / 2 + el.offsetHeight / 2;
      if (forceScroll || Math.abs(vp.scrollTop - target) > 8) {
        vp.scrollTo({ top: target, behavior: forceScroll ? 'auto' : 'smooth' });
      }
    }
  }

  function tick() {
    const pos = effectivePos();
    updateClock();
    if (isSynced) {
      const idx = findActiveIndex(pos);
      highlight(idx, false);
    }
    if (playing) rafId = requestAnimationFrame(tick);
  }

  function updateClock() {
    els.clock.textContent = formatTime(nowPos());
  }

  function updateOffsetLabel() {
    const sign = offset > 0 ? '+' : '';
    els.offsetLabel.textContent = '오프셋 ' + sign + offset.toFixed(1) + '초';
  }

  function updatePlayBtn() {
    if (playing) {
      els.playBtn.textContent = '⏸ 일시정지';
      els.playBtn.classList.add('playing');
      els.playBtn.classList.remove('btn-primary');
    } else {
      els.playBtn.textContent = baseTime > 0.05 ? '▶ 계속' : '▶ 시작';
      els.playBtn.classList.remove('playing');
      els.playBtn.classList.add('btn-primary');
    }
  }

  function startPlayback() {
    if (playing) return;
    playing = true;
    baseWall = performance.now();
    updatePlayBtn();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  function pausePlayback() {
    if (!playing) return;
    baseTime = nowPos();
    playing = false;
    updatePlayBtn();
    cancelAnimationFrame(rafId);
    updateClock();
  }

  function stopPlayback(resetTime) {
    playing = false;
    cancelAnimationFrame(rafId);
    if (resetTime) baseTime = 0;
    updatePlayBtn();
    updateClock();
  }

  function togglePlay() {
    if (playing) pausePlayback();
    else startPlayback();
  }

  function adjustOffset(delta) {
    offset = Math.round((offset + delta) * 10) / 10;
    updateOffsetLabel();
    if (currentSong) saveOffset(currentSong.id, offset);
    if (isSynced) highlight(findActiveIndex(effectivePos()), false);
  }

  function seekBy(delta) {
    baseTime = Math.max(0, nowPos() + delta);
    baseWall = performance.now();
    updateClock();
    if (isSynced) highlight(findActiveIndex(effectivePos()), true);
  }

  // ---------- Fullscreen ----------
  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
        document.body.classList.add('fs-mode');
      } else {
        await document.exitFullscreen();
        document.body.classList.remove('fs-mode');
      }
    } catch (e) {
      // Fallback: just hide chrome
      document.body.classList.toggle('fs-mode');
    }
  }
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) document.body.classList.remove('fs-mode');
    else document.body.classList.add('fs-mode');
  });

  // ---------- Events ----------
  els.searchBtn.addEventListener('click', doSearch);
  els.searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doSearch();
  });
  els.backBtn.addEventListener('click', showSearch);
  els.playBtn.addEventListener('click', togglePlay);
  els.resetBtn.addEventListener('click', () => {
    stopPlayback(true);
    activeIdx = -1;
    highlight(-1, true);
    const kids = els.lyricsBody.querySelectorAll('.lyric-line');
    kids.forEach((k) => k.classList.remove('active', 'near'));
    els.lyricsViewport.scrollTop = 0;
  });
  els.offsetMinus.addEventListener('click', () => adjustOffset(-0.5));
  els.offsetPlus.addEventListener('click', () => adjustOffset(0.5));
  els.seekBack.addEventListener('click', () => seekBy(-5));
  els.seekFwd.addEventListener('click', () => seekBy(5));
  els.fontMinus.addEventListener('click', () => {
    fontScale = Math.max(0.7, Math.round((fontScale - 0.1) * 10) / 10);
    applyFont();
  });
  els.fontPlus.addEventListener('click', () => {
    fontScale = Math.min(2, Math.round((fontScale + 0.1) * 10) / 10);
    applyFont();
  });
  els.fsBtn.addEventListener('click', toggleFullscreen);


  // ---------- Spotify auto-sync (PKCE) ----------
  const SP_LS = { cid: 'sp_client_id', tok: 'sp_tokens_v1', ver: 'sp_pkce_verifier', st: 'sp_pkce_state' };
  const SP_SCOPES = 'user-read-currently-playing user-read-playback-state';
  const redirectUri = () => location.origin + location.pathname;
  const spClientId = () => SPOTIFY_CLIENT_ID || localStorage.getItem(SP_LS.cid) || '';

  function b64url(bytes) {
    let s = '';
    bytes.forEach((b) => (s += String.fromCharCode(b)));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function randomVerifier(len = 64) {
    const cs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    const r = crypto.getRandomValues(new Uint8Array(len));
    return Array.from(r, (x) => cs[x % cs.length]).join('');
  }
  async function codeChallenge(verifier) {
    const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return b64url(new Uint8Array(d));
  }
  /** Position (sec) from a Spotify payload fetched at fetchedAt (ms epoch). */
  function spotifyPosition(progressMs, isPlaying, fetchedAt, now) {
    const p = progressMs + (isPlaying ? Math.max(0, now - fetchedAt) : 0);
    return p / 1000;
  }

  let spTokens = null;
  try { spTokens = JSON.parse(localStorage.getItem(SP_LS.tok) || 'null'); } catch {}
  let spTimer = 0, spDelay = 3000, spTrackId = null, spLoading = false;

  function setStatus(msg, on) {
    $('spStatus').textContent = msg;
    $('spStatus').classList.toggle('on', !!on);
  }
  function saveTokens(j) {
    spTokens = {
      access: j.access_token,
      refresh: j.refresh_token || (spTokens && spTokens.refresh),
      exp: Date.now() + (j.expires_in || 3600) * 1000,
    };
    localStorage.setItem(SP_LS.tok, JSON.stringify(spTokens));
  }
  async function tokenRequest(params) {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(Object.assign({ client_id: spClientId() }, params)),
    });
    if (!res.ok) throw new Error('토큰 오류 ' + res.status);
    saveTokens(await res.json());
  }
  async function ensureToken() {
    if (!spTokens) throw new Error('미연결');
    if (Date.now() > spTokens.exp - 60000) {
      await tokenRequest({ grant_type: 'refresh_token', refresh_token: spTokens.refresh });
    }
    return spTokens.access;
  }
  async function spConnect() {
    if (spTokens) { spDisconnect(); return; }
    if (!spClientId()) {
      $('spSettings').classList.remove('hidden');
      setStatus('먼저 Spotify Client ID를 입력하세요');
      return;
    }
    const v = randomVerifier();
    const state = randomVerifier(16);
    localStorage.setItem(SP_LS.ver, v);
    localStorage.setItem(SP_LS.st, state);
    const q = new URLSearchParams({
      response_type: 'code', client_id: spClientId(), scope: SP_SCOPES,
      redirect_uri: redirectUri(), code_challenge_method: 'S256',
      code_challenge: await codeChallenge(v), state,
    });
    location.href = 'https://accounts.spotify.com/authorize?' + q;
  }
  function spDisconnect() {
    clearTimeout(spTimer);
    spTokens = null; spTrackId = null;
    localStorage.removeItem(SP_LS.tok);
    stopPlayback(false);
    updateSpUi();
  }
  function updateSpUi() {
    $('spBtn').textContent = spTokens ? '연결 해제' : '🎵 Spotify 연결';
    if (!spTokens) setStatus('Spotify 미연결 · 수동 모드');
  }
  async function handleRedirect() {
    const u = new URL(location.href);
    const code = u.searchParams.get('code');
    const err = u.searchParams.get('error');
    if (!code && !err) return;
    history.replaceState(null, '', redirectUri());
    if (err) { setStatus('Spotify 연결 취소/오류: ' + err); return; }
    if (u.searchParams.get('state') !== localStorage.getItem(SP_LS.st)) {
      setStatus('Spotify 인증 state 불일치 — 다시 시도하세요'); return;
    }
    try {
      await tokenRequest({
        grant_type: 'authorization_code', code, redirect_uri: redirectUri(),
        code_verifier: localStorage.getItem(SP_LS.ver) || '',
      });
    } catch (e) { setStatus('Spotify 연결 실패: ' + e.message); }
    localStorage.removeItem(SP_LS.ver); localStorage.removeItem(SP_LS.st);
  }

  async function lrclibLookup(track) {
    const artist = (track.artists || []).map((a) => a.name)[0] || '';
    const q = new URLSearchParams({
      track_name: track.name, artist_name: artist,
      album_name: (track.album && track.album.name) || '',
      duration: String(Math.round(track.duration_ms / 1000)),
    });
    try {
      const r = await fetch(API + '/get?' + q);
      if (r.ok) { const j = await r.json(); if (j && (j.syncedLyrics || j.plainLyrics)) return j; }
    } catch {}
    const r2 = await fetch(API + '/search?' + new URLSearchParams({ track_name: track.name, artist_name: artist }));
    let list = r2.ok ? await r2.json() : [];
    if (!list.length) {
      const r3 = await fetch(API + '/search?q=' + encodeURIComponent(artist + ' ' + track.name));
      list = r3.ok ? await r3.json() : [];
    }
    if (!list.length) return null;
    const dur = track.duration_ms / 1000;
    list.sort((a, b) => (!!b.syncedLyrics - !!a.syncedLyrics) || (Math.abs(a.duration - dur) - Math.abs(b.duration - dur)));
    return list[0];
  }

  function applySpotifyClock(d, fetchedAt) {
    baseTime = spotifyPosition(d.progress_ms || 0, d.is_playing, fetchedAt, Date.now());
    baseWall = performance.now();
    if (d.is_playing && !playing) startPlayback();
    else if (!d.is_playing && playing) { playing = false; cancelAnimationFrame(rafId); updatePlayBtn(); }
    if (!playing) { updateClock(); if (isSynced) highlight(findActiveIndex(effectivePos()), false); }
  }

  async function handlePlayback(d, fetchedAt) {
    const t = d && d.item;
    if (!t || d.currently_playing_type !== 'track') {
      setStatus('🎵 Spotify 연결됨 · 지금 재생 중인 곡이 없어요', true);
      return;
    }
    const artist = t.artists.map((a) => a.name).join(', ');
    setStatus('🎵 Spotify 연결됨 · ' + (d.is_playing ? '재생 중' : '일시정지') + ' · ' + t.name + ' — ' + artist, true);
    if (t.id !== spTrackId && !spLoading) {
      spTrackId = t.id; spLoading = true;
      try {
        const data = await lrclibLookup(t);
        if (data) showSongData(data);
        else {
          showSongData({ id: 'sp:' + t.id, trackName: t.name, artistName: artist,
            albumName: t.album && t.album.name, duration: t.duration_ms / 1000,
            plainLyrics: '(LRCLIB에서 가사를 찾지 못했어요)' });
        }
      } catch (e) { setStatus('가사 검색 오류: ' + e.message, true); }
      spLoading = false;
      fetchedAt = fetchedAt; // clock re-applied below with drift
    }
    if (currentSong) applySpotifyClock(d, fetchedAt);
  }

  async function spPoll() {
    if (!spTokens) return;
    try {
      const tok = await ensureToken();
      const fetchedAt = Date.now();
      const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { Authorization: 'Bearer ' + tok },
      });
      if (res.status === 204) {
        setStatus('🎵 Spotify 연결됨 · 지금 재생 중인 곡이 없어요', true);
        if (playing) pausePlayback();
        spDelay = 3000;
      } else if (res.status === 429) {
        const ra = parseInt(res.headers.get('Retry-After') || '5', 10);
        spDelay = Math.min(60000, Math.max(ra * 1000, spDelay * 2));
        setStatus('Spotify 요청 제한 — ' + Math.round(spDelay / 1000) + '초 후 재시도', true);
      } else if (res.status === 401) {
        spTokens.exp = 0; spDelay = 1000;
      } else if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      } else {
        await handlePlayback(await res.json(), fetchedAt);
        spDelay = 3000;
      }
    } catch (e) {
      spDelay = Math.min(60000, spDelay * 2);
      if (String(e.message).startsWith('토큰 오류')) { spDisconnect(); setStatus('Spotify 세션 만료 — 다시 연결하세요'); return; }
      setStatus('Spotify 오류: ' + e.message + ' (재시도 ' + Math.round(spDelay / 1000) + '초)', true);
    }
    clearTimeout(spTimer);
    if (spTokens) spTimer = setTimeout(spPoll, spDelay);
  }

  $('spBtn').addEventListener('click', spConnect);
  $('spSettingsBtn').addEventListener('click', () => $('spSettings').classList.toggle('hidden'));
  $('spClientId').value = localStorage.getItem(SP_LS.cid) || SPOTIFY_CLIENT_ID;
  $('spRedirect').textContent = redirectUri();
  $('spSaveId').addEventListener('click', () => {
    localStorage.setItem(SP_LS.cid, $('spClientId').value.trim());
    $('spSettings').classList.add('hidden');
    setStatus('Client ID 저장됨 — 🎵 Spotify 연결을 누르세요');
  });
  window.__spotify = { codeChallenge, randomVerifier, spotifyPosition, lrclibLookup, handlePlayback, redirectUri };
  handleRedirect().then(() => { updateSpUi(); if (spTokens) { setStatus('🎵 Spotify 연결됨 · 확인 중…', true); spPoll(); } });

  // Init
  renderRecent();

  // Node/test hook
  window.__lyricsApp = { parseLRC, formatTime, findActiveIndex: (pos, ls) => {
    const prev = lines; lines = ls || lines;
    const r = findActiveIndex(pos);
    lines = prev;
    return r;
  }};
})();
</script>
</body>
</html>
